<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Encabezado principal de la aplicación -->
    <header>
        <h1>📝 Mis Tareas</h1>
    </header>

    <main>

        <!-- Formulario para crear nuevas tareas -->
        <section class="add-task">
            <input type="text" id="taskInput" placeholder="Escribe una tarea...">
            <select id="taskPriority" aria-label="Prioridad de la tarea">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
            </select>
            <input type="date" id="taskDate" aria-label="Fecha para hacer la tarea">
            <input type="time" id="taskTime" aria-label="Hora para hacer la tarea">
            <button id="addButton">Añadir</button>
        </section>

        <!-- Buscador para filtrar tareas por texto -->
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Buscar tareas..." aria-label="Buscar tareas">
        </div>

        <!-- Sección donde se muestran las tareas y sus filtros -->
        <section class="task-list">
            <div class="task-list-header">
                <h2>Tareas pendientes</h2>
                <button id="clearCompletedButton">Limpiar completadas</button>
            </div>
            <div class="task-filters">
                <label for="filterSelect">Filtrar:</label>
                <select id="filterSelect">
                    <option value="all">Mostrar todas</option>
                    <option value="pending">Solo pendientes</option>
                    <option value="completed">Solo completadas</option>
                </select>
                <button id="exportCsvBtn" class="secondary-button">Exportar PDF</button>
            </div>
            <div class="stats-panel" aria-label="Estadísticas de tareas">
                <div class="stat-card">
                    <span>Total</span>
                    <strong id="statTotal">0</strong>
                </div>
                <div class="stat-card pending">
                    <span>Pendientes</span>
                    <strong id="statPending">0</strong>
                </div>
                <div class="stat-card completed">
                    <span>Completadas</span>
                    <strong id="statCompleted">0</strong>
                </div>
                <div class="stat-card high-priority">
                    <span>Alta prioridad</span>
                    <strong id="statHighPriority">0</strong>
                </div>
            </div>
            <ul id="taskList">
                <!-- Las tareas aparecerán aquí -->
            </ul>
        </section>

    </main>

    <!-- Pie de página del proyecto -->
    <footer>
        <p>Creado con ayuda de IA 🤖</p>
    </footer>

    <!-- Carga de librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
