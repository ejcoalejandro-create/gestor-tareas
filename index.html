<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Encabezado principal de la aplicación -->
    <header>
        <h1>📝 Tareas Familia</h1>
    </header>

    <main>

        <!-- Formulario para crear nuevas tareas -->
        <section class="add-task">
            <input type="text" id="taskInput" placeholder="Escribe una tarea...">
            <select id="taskPriority" aria-label="Usuario asignado">
                <option value="filippa">Filippa</option>
                <option value="micaela" selected>Micaela</option>
                <option value="marcos">Marcos</option>
            </select>
            
            <!-- Selector para tarea única o repetitiva -->
            <div class="task-type-selector">
                <label>
                    <input type="radio" name="taskType" value="single" checked> Única
                </label>
                <label>
                    <input type="radio" name="taskType" value="repetitive"> Repetitiva
                </label>
            </div>
            
            <!-- Campos para tarea única -->
            <div id="singleTaskFields" class="task-fields-group">
                <input type="datetime-local" id="taskDate" aria-label="Fecha y hora para hacer la tarea">
            </div>
            
            <!-- Campos para tarea repetitiva -->
            <div id="repetitiveTaskFields" class="task-fields-group" style="display:none;">
                <input type="datetime-local" id="taskDateStart" aria-label="Fecha y hora de inicio">
                <input type="datetime-local" id="taskDateEnd" aria-label="Fecha y hora de fin">
                <select id="taskFrequency" aria-label="Frecuencia de repetición">
                    <option value="daily">Diario</option>
                    <option value="weekly">Semanal</option>
                    <option value="biweekly">Cada 15 días</option>
                    <option value="monthly">Mensual</option>
                </select>
            </div>
            
            <button id="addButton">Añadir</button>
        </section>

        <!-- Buscador para filtrar tareas por texto -->
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Buscar tareas..." aria-label="Buscar tareas">
        </div>

        <!-- Sección donde se muestran las tareas y sus filtros -->
        <section class="task-list">
            <div class="task-list-header">
                <h2>Tareas pendientes</h2>
                <button id="clearCompletedButton">Limpiar completadas</button>
            </div>
            <div class="task-filters">
                <label for="filterSelect">Filtrar:</label>
                <select id="filterSelect">
                    <option value="all">Mostrar todas</option>
                    <option value="pending">Solo pendientes</option>
                    <option value="completed">Solo completadas</option>
                </select>
                <button id="exportCsvBtn" class="secondary-button">Exportar PDF</button>
            </div>
            <div class="stats-panel" aria-label="Estadísticas de tareas">
                <div class="stat-card">
                    <span>Total</span>
                    <strong id="statTotal">0</strong>
                </div>
                <div class="stat-card pending">
                    <span>Pendientes</span>
                    <strong id="statPending">0</strong>
                </div>
                <div class="stat-card completed">
                    <span>Completadas</span>
                    <strong id="statCompleted">0</strong>
                </div>
                <div class="stat-card user-filippa">
                    <span>Tareas de Filippa</span>
                    <strong id="statFilippa">0</strong>
                </div>
                <div class="stat-card user-micaela">
                    <span>Tareas de Micaela</span>
                    <strong id="statMicaela">0</strong>
                </div>
                <div class="stat-card high-priority">
                    <span>Tareas de Marcos</span>
                    <strong id="statHighPriority">0</strong>
                </div>
            </div>
            <ul id="taskList">
                <!-- Las tareas aparecerán aquí -->
            </ul>
        </section>

    </main>

    <!-- Pie de página del proyecto -->
    <footer>
        <p>Trabajo Final: Avila, Marcos Alejandro</p>
    </footer>

    <!-- Carga de librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
